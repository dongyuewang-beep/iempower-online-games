<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>S1T3L7 记叙文写作互动学习</title>
<style>
:root{
  --blue:#103d78;
  --blue2:#245f9f;
  --yellow:#ffcc55;
  --cream:#fff9ea;
  --mint:#eaf8f0;
  --pink:#fff0f2;
  --line:#dbe7f1;
  --text:#26384a;
}
*{box-sizing:border-box}
body{
  margin:0;
  font-family:"KaiTi","STKaiti","Kaiti SC","KaiTi_GB2312",serif;
  background:linear-gradient(180deg,#f8fbff 0%,#fffdf8 100%);
  color:var(--text);
}
.app{max-width:980px;margin:0 auto;padding:18px}
.header{
  display:flex;justify-content:space-between;align-items:center;
  background:white;border-radius:18px;padding:10px 16px;
  box-shadow:0 3px 14px rgba(16,61,120,.07)
}
.code{font-weight:700;color:var(--blue);font-size:18px}
.logo{height:48px;max-width:170px;object-fit:contain}
.brand{font-weight:700;color:var(--blue)}
.hero{
  margin-top:14px;background:linear-gradient(135deg,#fff7d8,#eef6ff);
  border-radius:24px;padding:26px;border:1px solid #e9e2c9;
}
.hero h1{margin:0;color:var(--blue);font-size:34px}
.hero p{margin:9px 0 0;font-size:18px}
.pill{
  display:inline-block;margin-top:12px;background:white;color:var(--blue);
  border-radius:999px;padding:6px 12px;border:1px solid #d8e4ee;font-size:14px
}
.progressbox{margin:18px 0 10px}
.progresslabels{display:flex;justify-content:space-between;font-size:14px}
.progress{height:12px;border-radius:999px;background:#e6edf4;overflow:hidden}
.bar{height:100%;width:0;background:linear-gradient(90deg,var(--yellow),#ffa93d);transition:.3s}
.screen{margin-top:14px}
.card{
  background:white;border-radius:20px;padding:22px;border:1px solid var(--line);
  box-shadow:0 6px 18px rgba(0,0,0,.045);margin-bottom:16px
}
.lesson-title{font-size:24px;font-weight:700;color:var(--blue);margin-bottom:8px}
.story{
  background:var(--cream);border-left:7px solid var(--yellow)
}
.teacher-tip{
  background:#eef6ff;border-left:6px solid var(--blue2);padding:14px 16px;border-radius:12px;
  margin-top:14px;font-size:17px
}
.options{display:grid;gap:11px;margin-top:14px}
.option{
  width:100%;text-align:left;padding:14px 16px;border-radius:14px;
  border:2px solid #d8e5ef;background:#fff;font-family:inherit;font-size:18px;
  cursor:pointer;transition:.15s
}
.option:hover{transform:translateY(-1px);border-color:#9bbcd5}
.option.correct{background:var(--mint);border-color:#63aa7e}
.option.wrong{background:var(--pink);border-color:#d8757d}
.feedback{margin-top:13px;padding:12px 14px;border-radius:12px}
.feedback.good{background:var(--mint);color:#245e3a}
.feedback.bad{background:var(--pink);color:#8a3340}
.btnrow{display:flex;justify-content:flex-end;margin-top:14px}
.btn{
  border:0;border-radius:12px;padding:12px 18px;font-family:inherit;
  font-size:17px;font-weight:700;cursor:pointer
}
.primary{background:var(--blue);color:#fff}
.secondary{background:#edf4fa;color:var(--blue)}
.name{
  width:100%;max-width:380px;padding:13px 15px;border:2px solid #cbdbe7;
  border-radius:12px;font-family:inherit;font-size:18px
}
.center{text-align:center}
.tag{
  display:inline-block;background:#edf4fb;color:var(--blue);
  padding:5px 10px;border-radius:999px;margin-right:6px;font-size:14px
}
.emojis{font-size:36px;letter-spacing:12px;text-align:center;margin:12px 0}
.draglist{display:grid;gap:10px;margin-top:12px}
.dragitem{
  background:#fff;border:2px solid #d8e5ef;border-radius:13px;
  padding:13px 15px;cursor:grab;font-size:17px
}
.dragitem.dragging{opacity:.45}
.upgrade{
  display:grid;grid-template-columns:1fr;gap:10px;margin-top:12px
}
.level{
  border-radius:14px;padding:14px;border:1px solid #dce7ef;background:#f8fbfd
}
.level b{color:var(--blue)}
.summary{
  display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-top:16px
}
.summary .box{padding:15px;border:1px solid var(--line);border-radius:14px;background:#f9fbfd}
.score{font-size:48px;font-weight:700;color:var(--blue);margin:10px 0}
.footer{text-align:center;color:#6d7883;font-size:12px;margin:22px 0}
.small{font-size:14px;color:#667786}
.hidden{display:none}
@media(max-width:640px){
  .hero h1{font-size:28px}
  .hero{padding:20px}
  .option{font-size:17px}
  .lesson-title{font-size:22px}
  .logo{height:40px}
}
</style>
</head>

<script>
let stage=0, score=0, student="", wrong=[];
const screen=document.getElementById("screen");
const bar=document.getElementById("bar");
const stageLabel=document.getElementById("stageLabel");
const progressText=document.getElementById("progressText");
const labels=["准备开始","第一关：情绪侦探","第二关：审题找重点","第三关：心理描写排序","第四关：句子升级","第五关：好结尾","完成"];

function updateProgress(){
  let n=Math.min(stage,5);
  bar.style.width=(n*20)+"%";
  progressText.textContent=n+" / 5";
  stageLabel.textContent=labels[Math.min(stage,6)];
}

function intro(){
  screen.innerHTML=`
  <div class="card story">
    <div class="lesson-title">故事背景</div>
    <p>你的好友和班上一位比较内向的同学发生了误会。最近，你发现这位同学需要帮助。</p>
    <p><b>可是，如果你帮助他，你又担心好友会生气……你会怎么做？</b></p>
    <div class="teacher-tip">今天不是先写作文。我们先用 5 个小游戏，把这篇作文最重要的写作方法找出来。</div>
  </div>
  <div class="card center">
    <div class="lesson-title">准备好了吗？</div>
    <input id="studentName" class="name" placeholder="请输入姓名">
    <div style="margin-top:16px"><button class="btn primary" onclick="begin()">开始挑战 ⭐</button></div>
  </div>`;
}

function begin(){
  student=document.getElementById("studentName").value.trim()||"同学";
  stage=1; updateProgress(); q1();
}

function answer(el,ok,msg,key,nextCode){
  document.querySelectorAll(".option").forEach(b=>b.disabled=true);
  el.classList.add(ok?"correct":"wrong");
  if(ok) score+=20; else wrong.push(key);
  const fb=document.getElementById("feedback");
  fb.className="feedback "+(ok?"good":"bad");
  fb.innerHTML=msg;
  document.getElementById("nextWrap").classList.remove("hidden");
  document.getElementById("nextBtn").setAttribute("onclick",nextCode);
}

function q1(){
screen.innerHTML=`
<div class="card">
  <span class="tag">第一关</span><span class="tag">情绪侦探</span>
  <div class="emojis">😡 😳 😲 😔</div>
  <div class="lesson-title">哪一种情绪最符合这句话？</div>
  <p>“我红着脸，低下头，恨不得找个地洞钻进去。”</p>
  <div class="options">
    <button class="option" onclick="answer(this,false,'再看看“红着脸、低下头”这两个动作。','情绪判断','stage=2;updateProgress();q2()')">😡 愤怒</button>
    <button class="option" onclick="answer(this,true,'答对了！“红着脸、低下头”很能表现尴尬。','情绪判断','stage=2;updateProgress();q2()')">😳 尴尬</button>
    <button class="option" onclick="answer(this,false,'惊讶通常会有“瞪大眼睛、张大嘴巴”等反应。','情绪判断','stage=2;updateProgress();q2()')">😲 惊讶</button>
    <button class="option" onclick="answer(this,false,'后悔通常会出现“悔不该当初、早知道……”等心理活动。','情绪判断','stage=2;updateProgress();q2()')">😔 后悔</button>

  <div id="nextWrap" class="btnrow hidden"><button id="nextBtn" class="btn primary">下一关 →</button></div>
</div>

</div>`;
}

function q2(){

  <div class="lesson-title">这道作文真正要详细写什么？</div>
  <div class="options">
    <button class="option" onclick="answer(this,false,'误会是背景，只需要简单交代。','审题重点','stage=3;updateProgress();q3()')">好友和同学发生误会</button>
    <button class="option" onclick="answer(this,false,'同学遇到困难要写，但不是全文最重要的部分。','审题重点','stage=3;updateProgress();q3()')">同学遇到的困难</button>
    <button class="option" onclick="answer(this,true,'很好！这篇作文的重点就是“我的矛盾＋最后的决定”。','审题重点','stage=3;updateProgress();q3()')">我内心的矛盾和最后的决定</button>
    <button class="option" onclick="answer(this,false,'环境描写可以加一点，但不是全文重点。','审题重点','stage=3;updateProgress();q3()')">天气和教室环境</button>

}

function q3(){

"看着他无助的样子，我很想过去帮忙。",
"我犹豫了一会儿，终于鼓起勇气走了过去。",
"“如果我帮他，好友会不会认为我背叛了他？”"
];
screen.innerHTML=`
<div class="card">
  <span class="tag">第三关</span><span class="tag">拖一拖</span>
  <div class="lesson-title">把心理描写排成最自然的顺序</div>
  <p class="small">用鼠标拖动；手机可长按拖动。</p>
  <div id="dragList" class="draglist">
    ${items.map(x=>`<div class="dragitem" draggable="true" data-text="${x}">${x}</div>`).join("")}
  </div>
  <div class="btnrow"><button class="btn primary" onclick="checkOrder()">检查答案</button></div>
  <div id="feedback"></div>
</div>`;

const list=document.getElementById("dragList");
list.querySelectorAll(".dragitem").forEach(item=>{
  item.addEventListener("dragstart",()=>{dragged=item;item.classList.add("dragging")});
  item.addEventListener("dragend",()=>item.classList.remove("dragging"));
  item.addEventListener("dragover",e=>e.preventDefault());
  item.addEventListener("drop",e=>{
    e.preventDefault();
    if(!dragged||dragged===item)return;
    const children=[...list.children];
    let a=children.indexOf(dragged), b=children.indexOf(item);
    if(a<b)item.after(dragged); else item.before(dragged);
  });
});
}

function checkOrder(){
const ans=[
"看着他无助的样子，我很想过去帮忙。",
"可是，我刚迈出一步，又想起好友生气的样子。",
"“如果我帮他，好友会不会认为我背叛了他？”",
"我犹豫了一会儿，终于鼓起勇气走了过去。"
];
const cur=[...document.querySelectorAll(".dragitem")].map(x=>x.dataset.text);
const fb=document.getElementById("feedback");
if(JSON.stringify(cur)===JSON.stringify(ans)){
  score+=20;
  fb.className="feedback good";
  fb.innerHTML=`答对了！心理描写可以这样推进：<b>想帮助 → 犹豫 → 内心挣扎 → 作出决定</b>
  <div class="btnrow"><button class="btn primary" onclick="stage=4;updateProgress();q4()">下一关 →</button></div>`;
}else{
  if(!wrong.includes("心理描写排序"))wrong.push("心理描写排序");
  fb.className="feedback bad";
  fb.innerHTML="提示：先写“想帮助”，再写“想到好友而犹豫”，接着写内心挣扎，最后才是作出决定。";
}
}

    <button class="option" onclick="answer(this,true,'太好了！动作＋神态＋心理，人物立刻写活了。','句子升级','stage=5;updateProgress();q5()')">我停下脚步，皱着眉头，心里七上八下：“如果我帮助他，好友会不会认为我站在他的对立面？”</button>

  <div id="feedback"></div>

function finish(){

let review=wrong.length?wrong.map(x=>`<li>${x}</li>`).join(""):"<li>没有错题，表现很棒！</li>";
let title=score>=90?"写作小达人":score>=70?"写作探险家":"继续加油";
screen.innerHTML=`

}

updateProgress();
